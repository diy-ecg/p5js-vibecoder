<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.js Vibe Coder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="logo-box">⚡</div>
      <div class="header-titles">
        <h2>p5.js Vibe Coder</h2>
        <span class="version">Google Gemini Edition</span>
      </div>
    </header>

    <main class="popup-body">
      <!-- Status Box -->
      <div class="status-card" id="status-card">
        <span class="status-indicator" id="status-indicator"></span>
        <span id="status-text">Wird geladen...</span>
      </div>

      <!-- Settings Section -->
      <section class="form-group">
        <label for="gemini-key">Gemini API-Key</label>
        <div class="input-password-row">
          <input type="password" id="gemini-key" placeholder="AIzaSy..." spellcheck="false" autocomplete="off" />
          <button type="button" id="btn-toggle-key" class="btn-eye" title="Key anzeigen/verbergen">👁</button>
        </div>
        <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer" class="link-external">
          Kostenlosen Key bei Google AI Studio holen ↗
        </a>
      </section>

      <section class="form-group">
        <label for="gemini-model">Gemini Modell</label>
        <select id="gemini-model">
          <option value="gemini-2.5-flash">Gemini 2.5 Flash (Empfohlen)</option>
          <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
          <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
        </select>
      </section>

      <button id="btn-save" class="btn-primary">Einstellungen speichern</button>

      <div id="save-msg" class="save-feedback"></div>

      <!-- Shortcuts / Tips -->
      <section class="shortcuts-card">
        <h4>Tastatur-Shortcuts</h4>
        <ul>
          <li><kbd>Strg</kbd>+<kbd>Enter</kbd> : Code generieren</li>
          <li><kbd>Alt</kbd>+<kbd>V</kbd> : Panel anzeigen / minimieren</li>
        </ul>
      </section>
    </main>

    <footer class="popup-footer">
      <a href="https://editor.p5js.org/" target="_blank" class="btn-open-editor">
        p5.js Webeditor öffnen ↗
      </a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
